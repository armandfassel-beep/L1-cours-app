<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Révisions L1</title>
  <meta name="description" content="Mon application personnelle de révision (L1)">
  <!-- Permet d'ajouter l'appli à l'écran d'accueil de l'iPad comme une vraie appli -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Révisions">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f5f1">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applique le thème (clair / sombre / auto) le plus tôt possible pour éviter un flash.
    try {
      var s = JSON.parse(localStorage.getItem('revision-l1') || '{}');
      var t = s.reglages && s.reglages.theme;
      if (t === 'clair') document.documentElement.dataset.theme = 'light';
      if (t === 'sombre') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="barre">
    <a class="logo" href="#/">📚 <span>Révisions L1</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#/" data-nav="accueil"><span class="ico">🏠</span><span>Accueil</span></a>
      <a href="#/series" data-nav="series"><span class="ico">📝</span><span>Séries</span></a>
      <a href="#/progression" data-nav="progression"><span class="ico">📈</span><span>Progression</span></a>
      <a href="#/reglages" data-nav="reglages"><span class="ico">⚙️</span><span>Réglages</span></a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <p class="chargement">Chargement…</p>
  </main>

  <!-- Les scripts, dans l'ordre : chaque fichier a un rôle bien précis -->
  <script src="js/utils.js"></script>
  <script src="js/stockage.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/exercices.js"></script>
  <script src="js/graphiques.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
